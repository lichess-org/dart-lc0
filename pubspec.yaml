name: lc0
description: Lc0 Flutter no GPU
version: 0.1.0
repository: https://github.com/lichess-org/dart-lc0.git
homepage: https://github.com/lichess-org/dart-lc0.git

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  ffi: ^2.0.0
  flutter:
    sdk: flutter
  logging: ^1.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      # An FFI plugin: everything Dart talks to is a C symbol, so there is no
      # plugin class to register. The stub ones that used to exist were only
      # there to keep the linker from dropping those symbols, which is what
      # ffiPlugin arranges properly.
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
